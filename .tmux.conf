set -g mouse on
bind -Troot C-l send-keys C-l\; clear-history

# Right-click menu over shell output, with Open Link. Apps using the mouse still get the click (tmux's
# default test). -O keeps the menu open after release so a left click picks, as in nvim and Emacs.
bind -n MouseDown3Pane if -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" {
  select-pane -t = ; send-keys -M
} {
  display-menu -O -t = -x M -y M \
    "#{?#{||:#{mouse_hyperlink},#{m/r:https?://,#{mouse_line}}},Open Link,}" o { set-buffer -b url-at "#{mouse_x} #{?mouse_hyperlink,#{q:mouse_hyperlink},#{q:mouse_line}}" ; run-shell -b "~/.byobu/tmux-url open" } \
    "#{?#{||:#{mouse_hyperlink},#{m/r:https?://,#{mouse_line}}},Copy Link,}" y { set-buffer -b url-at "#{mouse_x} #{?mouse_hyperlink,#{q:mouse_hyperlink},#{q:mouse_line}}" ; run-shell -b "~/.byobu/tmux-url copy" } \
    '' \
    "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } \
    "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } \
    "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } \
    '' \
    "Horizontal Split" h { split-window -h } \
    "Vertical Split" v { split-window -v } \
    "#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }
}

source-file -q "$HOME/.byobu/tokyonight.tmux"
